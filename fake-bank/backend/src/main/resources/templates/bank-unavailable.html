<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Không khả dụng</title>
    <style>
        body { margin:0; padding:48px 16px; background:#f3f5f4; color:#1a1a1a;
               font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
        .card { max-width:420px; margin:0 auto; background:#fff; border:1px solid #e5e7eb;
                border-radius:12px; padding:28px; text-align:center; }
        h1 { font-size:17px; margin:0 0 8px; }
        p { color:#6b7280; margin:0 0 20px; font-size:14px; }
        a { display:inline-block; padding:10px 18px; border:1px solid #e5e7eb;
            border-radius:8px; color:#1a1a1a; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Không thể tiếp tục</h1>
    <p th:text="${reason}">Giao dịch không tồn tại.</p>
    <!-- Luôn cho người dùng một đường ra, đừng để họ mắc kẹt ở trang cụt. -->
    <a th:if="${returnUrl}" th:href="${returnUrl}">Quay về cửa hàng</a>
</div>
</body>
</html>
