spring:
  application:
    name: identity-provider
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:identity_user}
    password: ${SPRING_DATASOURCE_PASSWORD:identity_pass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

# Signing key RS256 — dev: keystore trong classpath (gitignored); prod: Secrets Manager/KMS
idp:
  jwk:
    keystore-location: classpath:keys/idp-signing.p12
    keystore-password: ${IDP_KEYSTORE_PASSWORD:changeit}
    key-alias: idp-signing
