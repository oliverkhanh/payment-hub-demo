<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ngân hàng đang gặp sự cố</title>
    <style>
        :root { --danger:#b3261e; --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
               background:#f4f5f7; color:var(--ink); display:flex; justify-content:center;
               padding:48px 16px; }
        .card { background:#fff; border-radius:14px; max-width:440px; width:100%; padding:28px;
                box-shadow:0 1px 3px rgba(0,0,0,.08); text-align:center; }
        .mark { width:46px; height:46px; border-radius:50%; background:#fdecea; color:var(--danger);
                font-size:26px; line-height:46px; margin:0 auto 14px; }
        h1 { font-size:18px; margin:0 0 10px; }
        p { font-size:13.5px; color:var(--muted); margin:0 0 6px; line-height:1.55; }
        .ref { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
               color:var(--muted); margin:14px 0 0; }
        a { display:inline-block; margin:22px 0 0; padding:11px 22px; border:1px solid var(--line);
            border-radius:8px; color:var(--ink); text-decoration:none; font-size:14px;
            font-weight:600; }
        a:hover { background:#f9fafb; }
    </style>
</head>
<body>
<div class="card">
    <div class="mark">!</div>
    <h1>Ngân hàng đang gặp sự cố</h1>
    <p>Hệ thống chưa xử lý được yêu cầu của bạn.</p>
    <p><strong>Giao dịch chưa bị trừ tiền.</strong> Bạn có thể quay lại và thử tài khoản khác.</p>
    <p class="ref" th:if="${bankTxnRef}" th:text="'Mã giao dịch: ' + ${bankTxnRef}"></p>
    <a th:href="${backUrl}" href="#">Quay lại trang thanh toán</a>
</div>
</body>
</html>
