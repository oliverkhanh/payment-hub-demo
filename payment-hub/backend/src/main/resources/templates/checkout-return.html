<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả thanh toán — Payment Hub</title>
    <style>
        :root { --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; }
        body { margin:0; padding:48px 16px; background:var(--bg); color:var(--ink);
               font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
        .card { max-width:420px; margin:0 auto; background:#fff; border:1px solid var(--line);
                border-radius:12px; padding:28px 24px; text-align:center; }
        h1 { font-size:17px; margin:0 0 8px; }
        p { color:var(--muted); font-size:14px; margin:0 0 20px; }
        .state { display:inline-block; font-size:11.5px; letter-spacing:.04em; color:var(--muted);
                 border:1px solid var(--line); border-radius:999px; padding:3px 10px;
                 margin:0 0 14px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
        a { display:inline-block; padding:10px 18px; border:1px solid var(--line);
            border-radius:8px; color:var(--ink); text-decoration:none; font-size:14px; }
        .note { margin-top:18px; font-size:12.5px; color:var(--muted); }
    </style>
</head>
<body>
<div class="card">
    <span class="state" th:if="${status}" th:text="${status}">IN_PROGRESS</span>
    <h1>Kết quả thanh toán</h1>
    <p th:text="${reason}">Đang xác minh kết quả với ngân hàng.</p>

    <!-- Luôn có đường về cửa hàng, dù trạng thái là gì. -->
    <a th:if="${returnUrl}" th:href="${returnUrl}">Về cửa hàng</a>

    <p class="note" th:if="${status != null and status.name() == 'IN_PROGRESS'}">
        Trình duyệt quay về không phải bằng chứng thanh toán. Hub chờ ngân hàng
        báo qua kênh server→server trước khi kết luận.
    </p>
</div>
</body>
</html>
