<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${bankName} + ' — Thanh toán'">Ngân hàng</title>
    <style>
        :root { --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bank:#0b7a3b;
                --bg:#f3f5f4; --err:#b42318; }
        * { box-sizing: border-box; }
        body { margin:0; padding:24px 16px; background:var(--bg); color:var(--ink);
               font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
        .card { max-width:440px; margin:0 auto; background:#fff; border:1px solid var(--line);
                border-radius:12px; padding:24px; }
        .bankbar { display:flex; align-items:center; gap:8px; margin:0 0 18px;
                   padding-bottom:14px; border-bottom:2px solid var(--bank); }
        .bankbar strong { font-size:17px; color:var(--bank); }
        .bankbar span { margin-left:auto; font-size:11.5px; color:var(--muted); letter-spacing:.04em; }
        dl { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:0 0 18px;
             padding-bottom:16px; border-bottom:1px solid var(--line); }
        dt { color:var(--muted); font-size:13px; }
        dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
        .amount { font-size:26px; font-weight:600; }
        .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
        label { display:block; font-size:13px; color:var(--muted); margin:0 0 5px; }
        input[type=text], input[type=password] { width:100%; padding:10px 12px; font-size:15px;
               border:1px solid var(--line); border-radius:8px; margin-bottom:14px;
               font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
        input:focus { outline:2px solid var(--bank); outline-offset:-1px; }
        button { width:100%; padding:12px; border-radius:8px; font-size:15px; cursor:pointer;
                 background:var(--bank); color:#fff; border:1px solid var(--bank); }
        button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line);
                       margin-top:8px; }
        .msg { border-radius:8px; padding:11px 13px; font-size:13px; margin:0 0 16px; }
        .msg.error { background:#fef3f2; border:1px solid #fda29b; color:var(--err); }
        .msg.notice { background:#fff8e1; border:1px solid #f5d98a; color:#7a5a00; }
        details { margin-top:20px; border-top:1px solid var(--line); padding-top:14px; }
        summary { font-size:13px; color:var(--muted); cursor:pointer; }
        table { width:100%; border-collapse:collapse; margin-top:10px; font-size:12px; }
        th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line);
                 white-space:nowrap; }
        th { color:var(--muted); font-weight:500; }
        td.num { text-align:right; font-variant-numeric:tabular-nums; }
        .tag { font-size:10.5px; padding:1px 5px; border-radius:4px; background:#eef2f1;
               color:var(--muted); }
        .pinnote { font-size:12px; color:var(--muted); margin:10px 0 0; }
    </style>
</head>
<body>
<div class="card">
    <div class="bankbar">
        <strong th:text="${bankName}">Ngân hàng</strong>
        <span th:text="${bankCode}">VCB</span>
    </div>

    <dl>
        <dt>Đơn vị thụ hưởng</dt>
        <dd th:text="${txn.merchantName}">Merchant</dd>

        <dt>Số tiền</dt>
        <dd class="amount">
            <!-- amount là minor unit. Định dạng CHỈ ở biên hiển thị (CLAUDE.md #4). -->
            <span th:text="${#numbers.formatInteger(txn.amount, 1, 'COMMA')}">0</span>
            <span th:text="${txn.currency}">VND</span>
        </dd>

        <dt>Mã giao dịch</dt>
        <dd class="mono" th:text="${txn.bankTxnId}">BNK-0000</dd>
    </dl>

    <p class="msg error" th:if="${error}" th:text="${error}">Lỗi</p>
    <p class="msg notice" th:if="${notice}" th:text="${notice}">Thông báo</p>

    <!--
      ⭐ Mã tài khoản và PIN chỉ tồn tại ở form NÀY và ở server của bank.
      Hub không bao giờ nhận chúng (spec §2.6) — đó là cách né phạm vi PCI DSS.
      Form POST về chính URL hiện tại: bank_txn_id trong URL đã là "vé vào cửa".
    -->
    <form method="post" autocomplete="off">
        <label for="account_code">Mã tài khoản</label>
        <!-- Placeholder lấy từ tài khoản thử nghiệm CỦA CHÍNH BANK NÀY.
             Hard-code "ACC-001" thì trang TCB/ACB gợi ý một mã không tồn tại ở đó. -->
        <input type="text" id="account_code" name="account_code"
               th:placeholder="${testAccounts.isEmpty()} ? 'ACC-xxx' : ${testAccounts[0].code}"
               th:value="${accountCode}" autocomplete="off" required
               maxlength="16" spellcheck="false">

        <label for="pin">Mã PIN</label>
        <!-- type=password: không hiện ra màn hình. KHÔNG bao giờ render lại giá trị PIN. -->
        <input type="password" id="pin" name="pin" placeholder="••••••"
               autocomplete="new-password" inputmode="numeric" required maxlength="8">

        <button type="submit">Xác nhận thanh toán</button>
    </form>

    <!-- Form RIÊNG: nút huỷ không được dính `required` của form thanh toán ở trên. -->
    <form th:action="@{'/banks/' + ${bankCode} + '/checkout/' + ${txn.bankTxnId} + '/cancel'}"
          method="post">
        <button type="submit" class="ghost">Hủy, quay về cửa hàng</button>
    </form>

    <!-- Bảng tài khoản thử nghiệm — cùng ý tưởng thẻ test của Stripe sandbox. -->
    <details open>
        <summary th:text="'Tài khoản thử nghiệm của ' + ${bankName}">Tài khoản thử nghiệm</summary>
        <table>
            <thead>
            <tr>
                <th>Mã</th><th>Chủ tài khoản</th><th class="num">Số dư</th><th>Tình trạng</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="acc : ${testAccounts}">
                <td class="mono" th:text="${acc.code}">ACC-001</td>
                <td th:text="${acc.holder}">Ana</td>
                <td class="num" th:text="${#numbers.formatInteger(acc.balance, 1, 'COMMA')}">0</td>
                <td>
                    <span class="tag" th:if="${acc.status.name() != 'ACTIVE'}"
                          th:text="${acc.status}">LOCKED</span>
                    <span class="tag" th:if="${acc.behavior.name() != 'NORMAL'}"
                          th:text="${acc.behavior}">SLOW</span>
                    <span th:if="${acc.status.name() == 'ACTIVE' and acc.behavior.name() == 'NORMAL'}"
                          class="tag">bình thường</span>
                </td>
            </tr>
            </tbody>
        </table>
        <!-- Chỉ giải thích "núm vặn" nào BANK NÀY thực sự có — cùng lý do với placeholder. -->
        <p class="pinnote">PIN đúng cho mọi tài khoản: <code>123456</code> (DEV-ONLY).
            <span th:if="${hasSlowAccount}"><code>SLOW</code> giả lập bank treo. </span>
            <span th:if="${hasErrorAccount}"><code>ERROR</code> giả lập bank trả 5xx.</span></p>
    </details>
</div>
</body>
</html>
